<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Equipment · RotorSense</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="app-body"><main class="app-shell">
  <header class="app-top"><a class="brand app-brand" href="/"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span>ROTOR<span class="brand-light">SENSE</span><small>INDUSTRIAL INTELLIGENCE</small></span></a><nav><a href="/">Home</a><a href="/history">Analysis History</a><a class="app-nav-cta" href="/diagnose">Detect Anomaly ↗</a></nav></header>
  <div class="app-heading"><div class="hero-kicker"><span class="status-dot"></span> ASSET LIBRARY</div><h1>Register Equipment</h1><p>Save one healthy reference video for each asset. Future inspections will use this reference automatically.</p></div>
  <section class="app-card">
    <form id="equipment-form" class="form-grid">
      <label>Equipment name<input name="name" required maxlength="80" placeholder="e.g. Cooling Fan A-01"></label>
      <label>Model or type <span class="optional">Optional</span><input name="model" maxlength="120" placeholder="e.g. Axial fan · Model X"></label>
      <label class="wide">Healthy reference video<input name="normal" type="file" accept="video/*,.mov,.mp4,.m4v,.avi" required><small>Use a stable, healthy operating condition. Slow-motion originals give the clearest frequency results.</small></label>
      <label>Capture frame rate (FPS)<input name="capture_fps" type="number" min="1" max="10000" step="any" value="240" required><small>Enter the camera capture rate, not the slowed playback rate.</small></label>
      <div class="wide"><button class="hero-cta form-cta" id="save-equipment" type="submit">Save Equipment <span aria-hidden="true">↗</span></button><div class="form-message" id="form-message" role="status"></div></div>
    </form>
  </section>
  <section class="app-card"><div class="section-heading"><div><div class="hero-kicker">REGISTERED ASSETS</div><h2>Your Equipment</h2></div><a class="text-link" href="/diagnose">Go to anomaly detection ↗</a></div><div id="equipment-list" class="asset-list"><p class="muted">Loading equipment…</p></div></section>
</main>
<script src="/static/common.js"></script><script>
const form=document.getElementById('equipment-form'),button=document.getElementById('save-equipment'),message=document.getElementById('form-message'),list=document.getElementById('equipment-list');
async function refreshEquipment(){
  try{const res=await fetch('/api/equipment'),items=await res.json();
    list.innerHTML=items.length?items.map(x=>`<article class="asset-row"><div class="asset-icon">${esc((x.name||'E').slice(0,1).toUpperCase())}</div><div class="asset-copy"><strong>${esc(x.name)}</strong><span>${esc(x.model||'Industrial equipment')} · ${esc(x.capture_fps)} FPS</span><small>Reference: ${esc(x.normal?.filename||'Healthy video')}</small></div><a class="text-link" href="/diagnose?equipment=${encodeURIComponent(x.id)}">Inspect ↗</a></article>`).join(''):'<p class="muted">No equipment registered yet. Add a healthy reference to get started.</p>';
  }catch(_){list.innerHTML='<p class="muted">Equipment list is unavailable right now.</p>';}
}
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Saving reference video…';message.className='form-message';button.disabled=true;
  try{const body=new FormData(form),res=await fetch('/api/equipment',{method:'POST',body}),data=await res.json();if(!res.ok)throw new Error(data.detail||'Could not register equipment.');message.textContent=`${data.name} is ready for anomaly detection.`;message.className='form-message success';form.reset();form.capture_fps.value='240';await refreshEquipment();}
  catch(err){message.textContent='Could not save this video. Check the file and capture FPS, then try again.';message.className='form-message error-text';}
  finally{button.disabled=false;}
});
refreshEquipment();
</script></body></html>
