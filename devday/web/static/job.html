<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>분석 결과 · 흔들림 비교 진단</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <a href="/" class="note">← 새 분석</a>
  <div class="eyebrow" id="files" style="margin-top:10px"></div>
  <h1 id="title">분석 중이에요</h1>
  <div id="demo-banner" class="demo-banner" hidden>데모 결과 · 이전 분석의 저장 데이터를 사용했어요. 새 AI 분석을 실행하지 않은 예시 화면입니다.</div>
  <div id="warnings"></div>
  <section id="progress" class="card">
    <h2>진행 상황</h2>
    <ol class="steps" id="steps"></ol>
    <p class="note" id="elapsed"></p>
  </section>
  <div id="failure"></div>
  <div id="result" hidden></div>
</main>
<script src="/static/common.js"></script>
<script>
const jobId = location.pathname.split('/').pop();
const fileUrl = (p) => `/api/jobs/${jobId}/files/${p}`;
let stages = [];
let timer = null;

async function init() {
  stages = (await (await fetch('/api/config')).json()).stages;
  poll();
}

function renderSteps(job) {
  const status = {}; job.events.forEach(e => { status[e.stage] = e.status; });
  document.getElementById('steps').innerHTML = stages.map(s => {
    let cls = '';
    if (job.state === 'done' || ['completed', 'skipped', 'insufficient'].includes(status[s.id])) cls = 'done';
    else if (s.id === job.stage && job.state === 'running') cls = 'now';
    return `<li class="${cls}"><span class="dot">${cls === 'done' ? '✓' : ''}</span>${esc(s.label)}</li>`;
  }).join('');
  const start = job.started_at ? new Date(job.started_at) : null;
  const end = job.finished_at ? new Date(job.finished_at) : new Date();
  document.getElementById('elapsed').textContent = job.state === 'queued'
    ? `앞선 분석이 끝나면 시작해요${job.queue_position ? ` (대기 ${job.queue_position}개)` : ''}.`
    : start ? `걸린 시간 ${Math.round((end - start) / 1000)}초 · 영상 길이와 해상도에 따라 2~5분 걸려요.` : '';
}

function verdictCard(r) {
  const d = r.decision || { label: 'insufficient', label_ko: '판단 불가' };
  const ai = LABEL_KO[d.model_decision] || '-'; const rule = LABEL_KO[d.rule_decision] || '-';
  return `<section class="verdict ${d.label}">
    <div class="eyebrow">최종 판정</div>
    <div class="big">${esc(d.label_ko)}</div>
    <p>${esc(r.summary || '')}</p>
    <div class="chips">
      <span class="chip">AI 판단: ${esc(ai)}</span><span class="chip">수치 규칙 판단: ${esc(rule)}</span>
      <span class="chip">${d.agreement ? '두 판단 일치' : '두 판단 불일치 → 보류'}</span>
    </div>
    ${d.agreement ? '' : `<p class="note" style="margin-top:10px">${esc(d.reason || '')}</p>`}
  </section>`;
}

function citedCard(r) {
  const th = r.thresholds || {};
  const rows = r.cited.map(c => `<tr><td>${esc(c.part)}</td><td class="nw">${esc(c.band)}</td><td>${esc(c.metric)}</td>
    <td class="num">${fmtNum(c.value, 4)}${c.unit ? ' ' + c.unit : ''}</td><td class="nw ${c.flag === '증가 기준 충족' ? 'flag-increase' : ''}">${esc(c.flag)}</td></tr>`).join('');
  return `<section class="card"><h2>판단 근거 수치</h2>
    ${rows ? `<div class="scroll"><table><tr><th>부위</th><th>대역</th><th>지표</th><th class="num">값</th><th>규칙</th></tr>${rows}</table></div>` : '<p class="note">AI가 인용한 수치가 없어요.</p>'}
    <p class="note">AI가 인용한 숫자는 코드가 측정값과 하나하나 대조했어요. 비정상 기준: 점검 영상 흔들림이 정상 대비 ${th.ratio_min ?? 1.5}배 이상, 변화 크기 z ≥ ${th.z_min ?? 3}, 배경 잡음보다 ${th.snr_min ?? 2}배 이상 큰 부위가 있을 때.</p></section>`;
}

function checksCard(r) {
  const img = r.images.find(i => i.path === 'visuals/inspection_roi.png');
  const hasIncrease = r.table.some(t => t.flag === 'increase' && t.used);
  if (!r.candidates.length && !hasIncrease) return '';
  const items = r.candidates.map(c => `<div class="check"><div class="n">${c.number}</div><div>
      <h3>${esc(c.part)}</h3><div class="conf">${c.confidence === 'low' ? '추가 확인 후보 · 근거가 약해요' : '우선 확인 후보'}</div>
      <p>${esc(c.reason)}</p><p class="action">${esc(c.action)}</p>
      ${c.alternatives?.length ? `<details><summary class="note">다른 가능성</summary><ul class="plain note">${c.alternatives.map(a => `<li>${esc(a)}</li>`).join('')}</ul></details>` : ''}
    </div></div>`).join('');
  return `<section class="card"><h2>어디를 확인하면 좋을까요?</h2><div class="grid2">
      ${img ? `<figure><img src="${fileUrl(img.path)}" alt="측정된 흔들림 증가 부위와 점검 후보 위치"><figcaption>빨강은 수치 규칙으로 흔들림 증가가 측정된 부위, 주황은 AI 추가 점검 후보, 하늘색 점은 영상에서 추적한 지점이에요.</figcaption></figure>` : ''}
      <div class="checks">${items || '<p class="note">수치 규칙 기준으로 흔들림 증가가 측정된 부위를 이미지에 표시했어요. 추가 점검 안내 후보는 없어요.</p>'}</div></div>
      <p class="note">흔들림이 커진 위치가 곧 고장 원인이라는 뜻은 아니에요.</p></section>`;
}

function spectrumCard(r) {
  const img = r.images.find(i => i.path === 'visuals/spectrum_comparison.png');
  if (!img) return '';
  return `<section class="card"><h2>주파수별 흔들림 비교</h2>
    <figure class="spectrum"><a href="${fileUrl(img.path)}" target="_blank"><img src="${fileUrl(img.path)}" alt="부위별 정상 영상과 점검 영상의 주파수 스펙트럼 비교" loading="lazy"></a>
    <figcaption>가로축은 주파수(Hz), 세로축은 영상에서 측정한 움직임 에너지예요. 파란색은 정상 영상, 빨간색은 점검 영상입니다. 음영은 선택된 측정 대역이에요.</figcaption></figure>
    <p class="note">점검 영상의 선이 높으면 해당 주파수에서 화면 움직임이 더 크게 측정된 것입니다. 이것만으로 고장이나 원인 위치가 확정되지는 않아요.</p></section>`;
}

function tableCard(r) {
  const rows = r.table.map(t => `<tr class="${t.used ? '' : 'unused'}"><td>${esc(t.part)}</td><td class="nw">${esc(t.band)}</td>
    <td class="num">${fmtNum(t.reference_px, 4)}</td><td class="num">${fmtNum(t.candidate_px, 4)}</td>
    <td class="num">${fmtNum(t.ratio, 2)}</td><td class="num">${fmtNum(t.z, 2)}</td>
    <td class="num">${fmtNum(t.reference_snr, 1)} / ${fmtNum(t.candidate_snr, 1)}</td>
    <td class="${t.flag === 'increase' ? 'flag-increase' : ''}">${esc(t.flag_ko)}${t.used ? '' : ' · 판단 제외'}</td></tr>`).join('');
  return `<section class="card"><h2>부위별 측정값</h2><div class="scroll"><table>
    <tr><th>부위</th><th>대역</th><th class="num">정상(px)</th><th class="num">점검(px)</th><th class="num">배율</th><th class="num">z</th><th class="num">신호/잡음</th><th>규칙</th></tr>${rows}</table></div>
    <p class="note">px = 화면 픽셀 단위 흔들림(RMS). 회색 줄은 추적 점이 부족하거나 배경 잡음 수준, AI가 신뢰도 낮음으로 표시해 판단에서 뺀 부위예요.</p></section>`;
}

function infoCard(r) {
  const a = r.alignment || {}; const tr = r.tracking || {}; const bg = r.background_floor || {};
  const side = (s) => tr[s] ? `분석 ${tr[s].decoded_frames ?? '-'}프레임${tr[s].timestamp_resampled ? ` · 빠진 프레임 ${Math.round((tr[s].missing_frame_fraction || 0) * 100)}% 시간 보정` : ''}` : '-';
  const floor = Object.entries(bg).map(([b, v]) => `${b}: ${fmtNum(v.reference, 4)} / ${fmtNum(v.candidate, 4)} px`).join(' · ');
  const tokens = r.model_calls.map(c => c.usage ? `${c.stage}: 입력 ${c.usage.input_tokens ?? '-'} · 출력 ${c.usage.output_tokens ?? '-'} 토큰` : c.stage).join(' / ');
  return `<section class="card"><h2>측정 정보</h2><dl class="kv">
    <dt>두 영상 위치 맞추기</dt><dd>${a.ok ? `배율 ${fmtNum(a.scale, 4)} · 회전 ${fmtNum(a.rotation_deg, 2)}° · 일치 점 ${a.inliers}개(${Math.round((a.inlier_fraction || 0) * 100)}%)` : esc(a.reason || '실패 · AI가 고른 위치 사용')}</dd>
    <dt>정상 영상</dt><dd>${side('reference')}</dd><dt>점검 영상</dt><dd>${side('candidate')}</dd>
    <dt>배경 잡음 (정상/점검)</dt><dd>${esc(floor || '-')}</dd>
    <dt>AI 호출</dt><dd>${esc(r.mode || '')} · ${esc(tokens || '-')}</dd></dl>
    ${r.limitations?.length ? `<details style="margin-top:12px"><summary>AI가 적은 한계</summary><ul class="plain">${r.limitations.map(l => `<li>${esc(l)}</li>`).join('')}</ul></details>` : ''}
    ${r.recommended_validation?.length ? `<details><summary>추가 확인 방법</summary><ul class="plain">${r.recommended_validation.map(l => `<li>${esc(l)}</li>`).join('')}</ul></details>` : ''}
    <p class="links" style="margin-top:12px"><a class="download" href="/api/jobs/${jobId}/archive">분석 기록 전체 다운로드 (영상 제외)</a></p>
    <p class="links">${r.files.map(f => `<a href="${fileUrl(f)}" target="_blank">${esc(f)}</a>`).join('')}</p></section>`;
}

function galleryCard(r) {
  const imgs = r.images.filter(i => !['visuals/inspection_roi.png','visuals/spectrum_comparison.png'].includes(i.path));
  if (!imgs.length) return '';
  return `<section class="card"><h2>측정 화면</h2><div class="gallery">${imgs.map(i => `<figure class="${i.path.includes('heatmap') ? 'wide' : ''}"><a href="${fileUrl(i.path)}" target="_blank"><img src="${fileUrl(i.path)}" alt="${esc(i.title)}" loading="lazy"></a><figcaption>${esc(i.title)}</figcaption></figure>`).join('')}</div>
    <p class="note">측정 지도는 코드가 측정값으로 그린 그림이에요. 고장 확률이 아니에요.</p></section>`;
}

async function poll() {
  let job;
  try { const res = await fetch(`/api/jobs/${jobId}`); if (!res.ok) throw new Error((await res.json()).detail); job = await res.json(); }
  catch (e) { document.getElementById('failure').innerHTML = `<div class="error">${esc(e.message || '서버에 연결할 수 없어요.')}</div>`; timer = setTimeout(poll, 4000); return; }
  document.getElementById('files').textContent = `${job.inputs.normal.filename} (정상) → ${job.inputs.candidate.filename} (점검) · ${fmtTime(job.created_at)}`;
  document.getElementById('warnings').innerHTML = (job.warnings || []).map(w => `<div class="warn">${esc(w)}</div>`).join('');
  renderSteps(job);
  if (job.state === 'failed') {
    document.getElementById('title').textContent = '분석하지 못했어요';
    const e = job.error || {};
    document.getElementById('failure').innerHTML = `<div class="card"><h2>이유</h2><div class="error">${esc(e.message || '')}</div>${(e.hints || []).map(h => `<p>${esc(h)}</p>`).join('')}</div>`;
    return;
  }
  if (job.state === 'done') {
    const r = job.results;
    document.getElementById('title').textContent = '분석 결과';
    document.getElementById('demo-banner').hidden = !job.is_demo;
    document.getElementById('progress').hidden = true;
    const out = document.getElementById('result');
    out.innerHTML = verdictCard(r) + citedCard(r) + checksCard(r) + spectrumCard(r) + tableCard(r) + galleryCard(r) + infoCard(r);
    out.hidden = false;
    return;
  }
  document.getElementById('title').textContent = job.state === 'queued' ? '순서를 기다리는 중이에요' : '분석 중이에요';
  timer = setTimeout(poll, 1500);
}
init();
</script>
</body>
</html>
